<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cash Book Smart</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cash Book">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#03082A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#03082A; --bg2:#020053; --surface:rgba(18,28,92,.55); --surface-solid:#0E1760;
  --surface-2:rgba(255,255,255,.06); --line:rgba(190,200,255,.14);
  --ink:#ECEDF2; --ink-2:#B6B5BA; --ink-3:#7F86A8;
  --silver:#E4E4E4; --accent:#3D7BFF; --accent-2:#69C3FF; --accent-ink:#fff;
  --owe:#FF8094; --owe-bg:rgba(255,128,148,.12);
  --paid:#4FE0A6; --paid-bg:rgba(79,224,166,.12);
  --credit:#69C3FF; --credit-bg:rgba(105,195,255,.12); --late:#FFB547; --late-bg:rgba(255,181,71,.13);
  --shadow:0 18px 40px -18px rgba(0,0,30,.8);
  --net:105,150,255;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --serif:'Cormorant Garamond','Times New Roman',Georgia,serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF1FA; --bg2:#E2E7F7; --surface:rgba(255,255,255,.8); --surface-solid:#fff;
    --surface-2:rgba(10,20,90,.05); --line:rgba(10,20,90,.1);
    --ink:#0A1150; --ink-2:#4A5182; --ink-3:#7C83A8;
    --silver:#0A1150; --accent:#2A5BE8; --accent-2:#1D8FD6;
    --owe:#D63A55; --owe-bg:rgba(214,58,85,.09);
    --paid:#0E9F6A; --paid-bg:rgba(14,159,106,.1);
    --credit:#1D7FC4; --credit-bg:rgba(29,127,196,.1); --late:#B86E00; --late-bg:rgba(184,110,0,.1);
    --shadow:0 14px 34px -18px rgba(10,20,90,.35);
    --net:42,91,232;
  }
}
:root[data-theme="light"]{
  --bg:#EEF1FA; --bg2:#E2E7F7; --surface:rgba(255,255,255,.8); --surface-solid:#fff;
  --surface-2:rgba(10,20,90,.05); --line:rgba(10,20,90,.1);
  --ink:#0A1150; --ink-2:#4A5182; --ink-3:#7C83A8;
  --silver:#0A1150; --accent:#2A5BE8; --accent-2:#1D8FD6;
  --owe:#D63A55; --owe-bg:rgba(214,58,85,.09);
  --paid:#0E9F6A; --paid-bg:rgba(14,159,106,.1);
  --credit:#1D7FC4; --credit-bg:rgba(29,127,196,.1); --late:#B86E00; --late-bg:rgba(184,110,0,.1);
  --shadow:0 14px 34px -18px rgba(10,20,90,.35);
  --net:42,91,232;
}
:root[data-theme="dark"]{
  --bg:#03082A; --bg2:#020053; --surface:rgba(18,28,92,.55); --surface-solid:#0E1760;
  --surface-2:rgba(255,255,255,.06); --line:rgba(190,200,255,.14);
  --ink:#ECEDF2; --ink-2:#B6B5BA; --ink-3:#7F86A8;
  --silver:#E4E4E4; --accent:#3D7BFF; --accent-2:#69C3FF;
  --owe:#FF8094; --owe-bg:rgba(255,128,148,.12);
  --paid:#4FE0A6; --paid-bg:rgba(79,224,166,.12);
  --credit:#69C3FF; --credit-bg:rgba(105,195,255,.12); --late:#FFB547; --late-bg:rgba(255,181,71,.13);
  --shadow:0 18px 40px -18px rgba(0,0,30,.8);
  --net:105,150,255;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;max-width:100vw;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
.app{overflow-x:clip}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);
  background:radial-gradient(120% 80% at 80% -10%,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
/* iOS zooms the page when a field under 16px gets focus; keep fields at 16px so the layout never shifts sideways */
input,select,textarea,.inp{font-size:16px}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;gap:12px;padding:6px 2px 18px}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line),0 8px 22px -8px rgba(61,123,255,.6)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{flex:1;min-width:0}
header.top .icon-btn{flex:none}
.brand h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(19px,5.6vw,26px);white-space:nowrap;letter-spacing:.3px;line-height:1.05;color:var(--silver)}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}

/* hero balance */
.hero{position:relative;border-radius:24px;padding:22px 20px 18px;overflow:hidden;
  background:linear-gradient(140deg,#1B2FB0 0%,#0B1470 48%,#050A3A 100%);color:#fff;box-shadow:var(--shadow);
  border:1px solid rgba(190,200,255,.18)}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 90% at 0% 0%,rgba(105,195,255,.35),transparent 60%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px);pointer-events:none}
.hero .lbl{font-size:13.5px;color:rgba(230,235,255,.75);position:relative;z-index:1}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.5px;margin:4px 0 2px;position:relative;z-index:1;text-align:start}
.hero .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:relative;z-index:1}
.hero .cell{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:9px 11px}
.hero .cell span{display:block;font-size:11.5px;color:rgba(230,235,255,.7)}
.hero .cell b{font-size:16px;font-weight:600}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.qa{display:flex;align-items:center;gap:10px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:right;transition:transform .15s,border-color .2s}
.qa:active{transform:scale(.97)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.qa .ic svg{width:20px;height:20px}
.qa b{display:block;font-size:14.5px;font-weight:600}
.qa small{color:var(--ink-3);font-size:12px}

h2.sec{font-size:16px;font-weight:600;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a,h2.sec button{font-size:13px;color:var(--accent-2);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:right;transition:background .15s}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--surface-2)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:#fff}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid small{color:var(--ink-3);font-size:12.5px}
.item .end{text-align:end;flex:none}
.item .end .bl{display:block;font-weight:700;font-size:14.5px;line-height:1.35}
.item .end b{display:block;font-weight:700;font-size:15px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.t-owe{color:var(--owe);background:var(--owe-bg)}
.t-paid{color:var(--paid);background:var(--paid-bg)}
.t-credit{color:var(--credit);background:var(--credit-bg)}
.c-owe{color:var(--owe)} .c-paid{color:var(--paid)} .c-credit{color:var(--credit)}
.txi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.txi svg{width:18px;height:18px}

.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.search input{flex:1;border:0;background:none;outline:none;height:100%}
.search svg{width:18px;height:18px;color:var(--ink-3)}
.chips{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto;padding-bottom:2px}
.chip{padding:7px 14px;border-radius:99px;font-size:13px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap;transition:all .2s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.empty{padding:34px 20px;text-align:center;color:var(--ink-2)}
.empty svg{width:54px;height:54px;color:var(--accent-2);opacity:.8;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* bottom nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px))}
nav.bottom .bar{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;height:66px;border-radius:22px;
  background:var(--surface-solid);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);padding:6px 10px;transition:color .2s;min-width:62px}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--accent-2)}
.fab{width:58px;height:58px;border-radius:19px;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#fff;display:grid;place-items:center;margin-top:-30px;
  box-shadow:0 12px 26px -8px rgba(61,123,255,.75),0 0 0 5px var(--bg);transition:transform .2s}
.fab:active{transform:scale(.9) rotate(45deg)}
.fab svg{width:26px;height:26px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(2,4,24,.62);z-index:40;opacity:0;transition:opacity .28s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;
  max-width:620px;margin:0 auto;background:var(--surface-solid);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
.sheet:not(.show){pointer-events:none;visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .25s,visibility 0s linear .4s}
.sheet.show{visibility:visible}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 2px;flex:none}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 6px;flex:none}
.sheet .sh-head h3{margin:0;font-size:18px;font-weight:700}
.sheet .sh-body{padding:8px 18px 20px;overflow-y:auto}
@media (min-width:700px){ .sheet{bottom:50%;border-radius:26px;border-bottom:1px solid var(--line);transform:translateY(60%) scale(.96);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .25s}
  .sheet.show{transform:translateY(50%);opacity:1} .sheet .grab{display:none} }

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:80px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(61,123,255,.18)}
select.inp{appearance:none}
.amount-inp{font-size:30px;font-weight:700;height:66px;text-align:center!important}
[dir=rtl] .inp.num{text-align:right}
[dir=rtl] .hero .big,[dir=rtl] .hero .sub{text-align:right}
.row2{display:grid;grid-template-columns:1fr 130px;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:4px;position:relative;margin-bottom:14px}
.seg button{position:relative;z-index:1;height:46px;border-radius:12px;font-weight:600;font-size:14px;transition:color .25s;color:var(--ink-2)}
.seg .pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:12px;transition:transform .3s cubic-bezier(.2,.9,.25,1),background .3s;inset-inline-start:4px}
.seg[data-v="payment"] .pill,.cseg[data-v="LBP"] .pill{transform:translateX(-100%)}
[dir=ltr] .seg[data-v="payment"] .pill,[dir=ltr] .cseg[data-v="LBP"] .pill{transform:translateX(100%)}
.cseg .pill{background:rgba(61,123,255,.16);box-shadow:inset 0 0 0 1px var(--accent)}
.cseg[data-v="USD"] button[data-v="USD"],.cseg[data-v="LBP"] button[data-v="LBP"]{color:var(--accent-2)}
.seg[data-v="deposit"] .pill{background:var(--owe-bg);box-shadow:inset 0 0 0 1px var(--owe)}
.seg[data-v="payment"] .pill{background:var(--paid-bg);box-shadow:inset 0 0 0 1px var(--paid)}
.seg[data-v="deposit"] button[data-v="deposit"]{color:var(--owe)}
.seg[data-v="payment"] button[data-v="payment"]{color:var(--paid)}
.hint{font-size:12.5px;color:var(--ink-3);margin:-6px 2px 14px}
.btn{text-decoration:none;height:52px;border-radius:16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .15s,filter .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn-p{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 10px 22px -10px rgba(61,123,255,.8)}
.btn-wa{background:#1FAF5A;color:#fff;box-shadow:0 10px 22px -10px rgba(31,175,90,.7)}
.btn-g{background:var(--surface-2);border:1px solid var(--line)}
.btn-d{color:var(--owe);background:var(--owe-bg)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn[disabled]{opacity:.5;pointer-events:none}

.cust-head{text-align:center;padding:6px 0 14px}
.cust-head .av{width:64px;height:64px;font-size:22px;margin:0 auto 8px}
.cust-head h4{margin:0;font-size:19px}
.cust-head .ph{color:var(--ink-3);font-size:13px}
.balbox{border-radius:18px;padding:16px;text-align:center;margin-bottom:14px;border:1px solid var(--line)}
.balbox span{font-size:13px;color:var(--ink-2)}
.balbox b{display:block;font-size:30px;font-weight:700;margin-top:2px;line-height:1.3}
.mini-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mini-acts button,.mini-acts a{color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:500;transition:transform .15s}
.mini-acts a:active,.mini-acts button:active{transform:scale(.95)}
.mini-acts .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.mini-acts svg{width:19px;height:19px}

/* invoice */
.invoice{border-radius:20px;overflow:hidden;background:#fff;color:#0A1150;box-shadow:0 20px 40px -20px rgba(0,0,40,.6);margin-bottom:16px}
.inv-top{background:linear-gradient(140deg,#1B2FB0,#050A3A);color:#fff;padding:18px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.inv-top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 1px,transparent 1px 18px)}
.inv-top img{width:54px;height:54px;border-radius:12px;position:relative;z-index:1}
.inv-top .t{flex:1;position:relative;z-index:1}
.inv-top .t b{font-family:var(--serif);font-size:21px;display:block;line-height:1.1}
.inv-top .t small{opacity:.75;font-size:12px}
.inv-top .no{position:relative;z-index:1;text-align:end;font-size:12px;opacity:.9}
.inv-top .no b{display:block;font-size:15px}
.inv-body{padding:16px 18px}
.inv-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #D5D9EA;font-size:14px}
.inv-line span{color:#5A6190}
.inv-line:last-child{border-bottom:0}
.inv-total{margin-top:10px;background:#EEF1FB;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.inv-total b{font-size:22px}
.inv-foot{text-align:center;font-size:12px;color:#7C83A8;padding:0 18px 16px}
.stamp{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700}

/* success */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:60;background:var(--surface-solid);border:1px solid var(--line);
  box-shadow:var(--shadow);border-radius:16px;padding:11px 16px;display:flex;align-items:center;gap:10px;font-weight:500;transition:transform .4s cubic-bezier(.2,.9,.25,1.2);max-width:90%}
.toast{opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,calc(-100% - 40px - env(safe-area-inset-top,0px)))!important;transition:transform .4s cubic-bezier(.2,.9,.25,1.2),opacity .25s,visibility 0s linear .4s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)!important;transition:transform .4s cubic-bezier(.2,.9,.25,1.2),opacity .2s,visibility 0s}
.toast .ck{width:26px;height:26px;border-radius:50%;background:var(--paid);display:grid;place-items:center;flex:none}
.toast .ck svg{width:16px;height:16px;color:#fff}
.toast .ck path{stroke-dasharray:24;stroke-dashoffset:24}
.toast.show .ck path{animation:draw .45s .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done-ring{width:84px;height:84px;margin:6px auto 12px;border-radius:50%;background:var(--paid-bg);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,.9,.25,1.4)}
.done-ring svg{width:44px;height:44px;color:var(--paid)}
.done-ring path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}

.view{display:none}
.view.on{display:block;animation:viewin .35s ease}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.loading{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--ink-3)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent-2);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{font-size:12.5px;color:var(--ink-3);text-align:center;margin:18px 0 0}
.set-group{margin-bottom:18px}
.theme-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.theme-seg button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px}
.lang-seg{grid-template-columns:1fr 1fr}
.ro .w{display:none!important}
.banner{border-radius:16px;padding:12px 14px;margin:0 0 14px;background:var(--credit-bg);color:var(--credit);font-size:13.5px;border:1px solid var(--line)}
.hero .sub{position:relative;z-index:1;font-size:15px;font-weight:600;color:rgba(230,235,255,.85);margin-bottom:14px;min-height:6px}

.aseg[data-v="register"] .pill{transform:translateX(-100%)}

.aseg .pill{background:rgba(61,123,255,.16);box-shadow:inset 0 0 0 1px var(--accent)}
.aseg[data-v="login"] button[data-v="login"],.aseg[data-v="register"] button[data-v="register"]{color:var(--accent-2)}
.auth-err{color:var(--owe);background:var(--owe-bg);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 12px}
.auth-err.ok{color:var(--paid);background:var(--paid-bg)}
.auth-link{display:block;margin:14px auto 0;color:var(--accent-2);font-size:13.5px}
.inp[dir=ltr]{text-align:left}

.curtabs{margin-bottom:14px}
.hero .big{white-space:nowrap;font-size:clamp(28px,9.5vw,40px)}
.hero.lbp .big{font-size:clamp(24px,7.8vw,36px)}

.hero.lbp .cell b{font-size:14px}
.curtabs button{font-size:14.5px}

.hero.lbp{background:linear-gradient(140deg,#6A2FC0 0%,#2A1078 48%,#0B0538 100%)}
.hero.lbp::after{background:radial-gradient(60% 90% at 0% 0%,rgba(190,140,255,.35),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px)}

.phone-wrap{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden;transition:border-color .2s,box-shadow .2s}

.phone-wrap .cc{position:relative;display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer;padding:0 10px 0 14px;font-weight:600;color:var(--ink-2);border-inline-end:1px solid var(--line);font-variant-numeric:tabular-nums;background:var(--surface-2)}
.phone-wrap .cc svg{width:16px;height:16px;opacity:.6}
.phone-wrap .cc select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.phone-wrap .inp{border:0;background:none;box-shadow:none!important;text-align:left!important;border-radius:0}
.send-lbl{font-size:13px;color:var(--ink-2);margin:0 2px 8px;font-weight:500;text-align:center}
.btn-wa-o{background:rgba(31,175,90,.13);color:#1FAF5A;border:1px solid rgba(31,175,90,.35)}
.btn-wa-o[aria-busy="true"]{opacity:.6}
.img-preview{display:block;width:100%;border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.cpick{display:flex;flex-direction:column;gap:8px}
.cp-sel{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);text-align:start}
.cp-sel .av,.cp-item .av{width:34px;height:34px;font-size:13px}
.cp-sel svg{width:18px;height:18px;margin-inline-start:auto;opacity:.6}
.cp-name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-ph{flex:1;color:var(--ink-3)}
.cp-chg{font-size:13px;color:var(--accent-2)}
.cp-list{border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--surface-2)}
.cp-list .inp{height:44px;margin-bottom:6px}
.cp-items{max-height:228px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cp-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;text-align:start}
.cp-item.on{background:rgba(61,123,255,.16);box-shadow:inset 0 0 0 1px var(--accent)}
.cp-item:active{background:var(--surface-2)}
.mini-seg button{height:42px}
.row2{grid-template-columns:1fr 140px}
.credit-card{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;border-radius:20px;text-align:start;
  background:linear-gradient(135deg,var(--credit-bg),transparent 70%),var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--credit);transition:transform .15s}
[dir=rtl] .credit-card{box-shadow:inset -3px 0 0 var(--credit)}
.credit-card:active{transform:scale(.98)}
.cr-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--credit-bg);color:var(--credit);flex:none}
.cr-ic svg{width:22px;height:22px}
.cr-mid{flex:1;min-width:0}
.cr-mid small{display:block;color:var(--ink-2);font-size:12.5px}
.cr-mid b{display:block;font-size:21px;font-weight:700;color:var(--credit);line-height:1.3}
.cr-count{font-size:12.5px;color:var(--credit);background:var(--credit-bg);padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.cr-chev{width:18px;height:18px;color:var(--ink-3);flex:none}
[dir=ltr] .cr-chev{transform:scaleX(-1)}
.credit-card.zero .cr-mid b{color:var(--ink-2)}
.credit-card.zero{box-shadow:none;background:var(--surface)}
.late-card{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border-radius:20px;text-align:start;
  background:linear-gradient(135deg,var(--late-bg),transparent 70%),var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--late);animation:pop .45s ease}
[dir=rtl] .late-card{box-shadow:inset -3px 0 0 var(--late)}
.late-card .cr-mid b{color:var(--late)}
.lt-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--late-bg);color:var(--late);flex:none}
.lt-ic svg{width:22px;height:22px}
.lt-count{font-size:12.5px;color:var(--late);background:var(--late-bg);padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.t-late{color:var(--late);background:var(--late-bg)}
.bal-sub{display:block;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.bal-sub.is-late{color:var(--late);font-weight:600}
.btn-remind{background:var(--late-bg);color:var(--late);border:1px solid color-mix(in srgb,var(--late) 40%,transparent)}
.btn-remind.hot{background:var(--late);color:#1a1200;border-color:transparent;box-shadow:0 10px 22px -12px var(--late)}
.r-nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.r-nav b{font-size:17px}
[dir=ltr] .r-nav svg{transform:scaleX(-1)}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r-tile{border-radius:16px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line)}
.r-tile span{display:block;font-size:12px;color:var(--ink-2)}
.r-tile b{display:block;font-size:19px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-chart{width:100%;height:auto;display:block;font-family:var(--font)}
.r-legend{display:flex;gap:16px;justify-content:center;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.r-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
header.top{gap:8px}
#xlsBtn svg{width:20px;height:20px}
.lock-row{display:flex;align-items:center;gap:12px;padding:12px 0 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.lr-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(61,123,255,.14);color:var(--accent-2);flex:none}
.lr-ic svg{width:22px;height:22px}
.lr-txt{flex:1;min-width:0}
.lr-txt b{display:block;font-size:14.5px}
.lr-txt small{display:block;color:var(--ink-3);font-size:12.5px}
.switch{position:relative;width:52px;height:32px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);flex:none;transition:background .25s}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.9,.25,1.2)}
.switch[aria-checked="true"]{background:var(--paid)}
[dir=ltr] .switch[aria-checked="true"] i{transform:translateX(20px)}
[dir=rtl] .switch[aria-checked="true"] i{transform:translateX(-20px)}
.switch:disabled{opacity:.45}
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));
  background:radial-gradient(120% 80% at 80% -10%,var(--bg2) 0%,var(--bg) 60%),var(--bg)}
.lock-card{width:100%;max-width:380px;text-align:center;animation:pop .45s cubic-bezier(.2,.9,.25,1.2)}
.lock-face{width:104px;height:104px;border-radius:32px;margin:18px auto 12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--accent-2),var(--accent));box-shadow:0 18px 40px -14px rgba(61,123,255,.8);animation:breathe 2.4s ease-in-out infinite}
.lock-face svg{width:56px;height:56px}
.lock-face:active{transform:scale(.94)}
@keyframes breathe{0%,100%{box-shadow:0 18px 40px -14px rgba(61,123,255,.8)}50%{box-shadow:0 18px 50px -8px rgba(61,123,255,1)}}
.lock-hint{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.lock-hint.err{color:var(--late)}
#lockPassBox{text-align:start;margin-bottom:6px}
div.item{cursor:pointer;-webkit-tap-highlight-color:transparent}
div.item:hover{background:var(--surface-2)}
.qbs{display:flex;gap:6px;flex:none}
.qb{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--accent-2);transition:transform .15s}
.qb:active{transform:scale(.9)}
.qb svg{width:17px;height:17px}
.qb.wa{color:#1FAF5A}
@media (max-width:360px){ .qbs{display:none} }
.t-due{color:var(--accent-2);background:rgba(61,123,255,.14)}
.tr-badge{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--owe);color:#fff;font-size:12px;display:inline-grid;place-items:center;margin-inline-start:4px}
#trashBtn svg{width:20px;height:20px}
.tr-acts{display:flex;gap:6px;flex:none}
.tr-btn{height:34px;padding:0 12px;border-radius:10px;background:rgba(61,123,255,.14);color:var(--accent-2);font-size:13px;font-weight:600}
.tr-btn.del{background:var(--owe-bg);color:var(--owe);padding:0 11px}
.conv-btn{margin:-4px 0 14px;height:44px;font-size:14px}
.conv-box{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.conv-from,.conv-to{flex:1;border-radius:16px;padding:12px;background:var(--surface-2);border:1px solid var(--line);text-align:center;min-width:0}
.conv-box small{display:block;color:var(--ink-2);font-size:12px}
.conv-box b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-arrow{font-size:22px;color:var(--accent-2);flex:none}
.hero .sub{font-size:13.5px;font-weight:500;opacity:.9}
.sheet{max-width:min(620px,100vw);overflow:hidden}
.sh-body{overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}
.sh-body *{min-width:0}
.field,.cpick,.seg,.row2,.btn-row{max-width:100%}
input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;text-align:start;line-height:48px}
input[type=date].inp::-webkit-date-and-time-value{text-align:start;margin:0}
.theme-seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:380px){.hero .big{font-size:34px}.hero .row{grid-template-columns:1fr 1fr}.hero .cell:last-child{display:none}}
</style>

</head>
<body>
<canvas id="net" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="logo"><img id="logoImg" alt="Smart Capital Trade"></div>
    <div class="brand"><h1>Cash Book Smart</h1><p id="coName">Smart Capital Trade</p></div>
    <button class="icon-btn" id="reportBtn" data-i18n-aria="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button class="icon-btn" id="themeBtn" data-i18n-aria="themeAria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>

  <div id="loading" class="loading"><div><div class="spin"></div><span data-i18n="loading"></span></div></div>

  <section id="auth" class="auth" hidden>
    <div class="auth-card">
      <img class="auth-logo" id="authLogo" alt="Smart Capital Trade">
      <h2 class="auth-title">Cash Book Smart</h2>
      <p class="auth-sub" id="authSub" data-i18n="authSub"></p>
      <div id="authForm">
        <div class="seg aseg" id="aSeg" data-v="login"><span class="pill"></span><button data-v="login" data-i18n="login"></button><button data-v="register" data-i18n="register"></button></div>
        <div class="field"><label for="aEmail" data-i18n="email"></label><input class="inp" id="aEmail" type="email" autocomplete="email" dir="ltr" inputmode="email"></div>
        <div class="field"><label for="aPass" data-i18n="password"></label><input class="inp" id="aPass" type="password" autocomplete="current-password" dir="ltr"></div>
        <div class="field" id="aConfWrap" hidden><label for="aConf" data-i18n="confirmPass"></label><input class="inp" id="aConf" type="password" autocomplete="new-password" dir="ltr"></div>
        <p class="auth-err" id="aErr" hidden></p>
        <button class="btn btn-p" id="aSubmit"></button>
        <button class="auth-link" id="aForgot" data-i18n="forgot"></button>
      </div>
    </div>
  </section>

  <main id="main" hidden>
    <div class="banner" id="roBanner" hidden data-i18n="readOnly"></div>
    <section class="view on" id="v-home">
      <div class="seg cseg curtabs" data-v="USD"><span class="pill"></span><button data-v="USD" data-i18n="usdTab"></button><button data-v="LBP" data-i18n="lbpTab"></button></div>
      <div class="hero" id="hero">
        <div class="lbl" id="hLbl"></div>
        <div class="big num" id="hTotal">$0.00</div>
        <div class="sub num" id="hTotalL"></div>
        <div class="row">
          <div class="cell"><span data-i18n="monthIn"></span><b class="num" id="hIn">$0</b><i class="num" id="hInL"></i></div>
          <div class="cell"><span data-i18n="monthOut"></span><b class="num" id="hOut">$0</b><i class="num" id="hOutL"></i></div>
          <div class="cell"><span data-i18n="debtors"></span><b class="num" id="hCount">0</b></div>
        </div>
      </div>
      <button class="credit-card" id="creditCard">
        <span class="cr-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H5"/><circle cx="16" cy="14" r="1.4"/></svg></span>
        <span class="cr-mid"><small data-i18n="creditTitle"></small><b class="num" id="crTotal">$0.00</b></span>
        <span class="cr-count" id="crCount"></span>
        <svg class="cr-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <button class="late-card" id="lateCard" hidden>
        <span class="lt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></span>
        <span class="cr-mid"><small id="ltTitle"></small><b class="num" id="ltTotal"></b></span>
        <span class="lt-count" id="ltCount"></span>
        <svg class="cr-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <div class="quick w">
        <button class="qa" data-act="new-deposit"><span class="ic" style="background:var(--owe-bg);color:var(--owe)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span><span><b data-i18n="qaDep"></b><small data-i18n="qaDepSub"></small></span></button>
        <button class="qa" data-act="new-payment"><span class="ic" style="background:var(--paid-bg);color:var(--paid)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span><span><b data-i18n="qaPay"></b><small data-i18n="qaPaySub"></small></span></button>
      </div>
      <h2 class="sec"><span data-i18n="topDue"></span> <button data-go="customers" data-i18n="allCust"></button></h2>
      <div class="panel" id="topDebtors"></div>
      <div id="dueSection" hidden>
        <h2 class="sec"><span data-i18n="duesTitle"></span></h2>
        <div class="panel" id="dueList"></div>
      </div>
      <div id="crSection" hidden>
        <h2 class="sec"><span data-i18n="creditList"></span> <button id="crAll" data-i18n="viewAll"></button></h2>
        <div class="panel" id="creditList"></div>
      </div>
      <h2 class="sec"><span data-i18n="recent"></span> <button data-go="txns" data-i18n="viewAll"></button></h2>
      <div class="panel" id="recentTx"></div>
    </section>

    <section class="view" id="v-customers">
      <h2 class="sec" style="margin-top:4px"><span data-i18n="customers"></span> <button class="w" data-act="new-customer" data-i18n="newCustBtn"></button></h2>
      <div class="seg cseg curtabs" data-v="USD"><span class="pill"></span><button data-v="USD" data-i18n="usdTab"></button><button data-v="LBP" data-i18n="lbpTab"></button></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="cSearch" data-i18n-ph="search" autocomplete="off"></div>
      <div class="chips" id="cFilter">
        <button class="chip on" data-f="all" data-i18n="fAll"></button>
        <button class="chip" data-f="owe" data-i18n="fOwe"></button>
        <button class="chip" data-f="paid" data-i18n="fPaid"></button>
        <button class="chip" data-f="credit" data-i18n="fCredit"></button>
        <button class="chip" data-f="late" data-i18n="fLate"></button>
      </div>
      <div class="panel" id="custList"></div>
    </section>

    <section class="view" id="v-txns">
      <h2 class="sec" style="margin-top:4px" data-i18n="allTx"></h2>
      <div class="seg cseg curtabs" data-v="USD"><span class="pill"></span><button data-v="USD" data-i18n="usdTab"></button><button data-v="LBP" data-i18n="lbpTab"></button></div>
      <div class="chips" id="tFilter">
        <button class="chip on" data-f="all" data-i18n="fAll"></button>
        <button class="chip" data-f="deposit" data-i18n="fDep"></button>
        <button class="chip" data-f="payment" data-i18n="fPayF"></button>
      </div>
      <div class="panel" id="txList"></div>
    </section>

    <section class="view" id="v-settings">
      <h2 class="sec" style="margin-top:4px" data-i18n="settings"></h2>
      <div class="panel" style="padding:18px;margin-bottom:14px">
        <div class="field"><label data-i18n="sLang"></label>
          <div class="theme-seg lang-seg" id="langSeg"><button data-l="ar">العربية</button><button data-l="en">English</button></div>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CURS=['USD','LBP'];
const nf0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
function money(n,cur='USD',compact=false){
  n=n||0;
  if(cur==='LBP'){
    const s = compact ? new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(n) : nf0.format(Math.round(n));
    return LANG==='ar' ? s+' ل.ل' : 'LBP '+s;
  }
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:compact?0:2,maximumFractionDigits:compact?0:2}).format(n);
}

const DEFAULT_SETTINGS = { company:'Smart Capital Trade', phone:'', footer:null, currency:'USD', reminderDays:30, rate:89500 };
const S = { customers:[], txns:[], settings:{...DEFAULT_SETTINGS}, mode:'cloud', base:null, user:null, uid:null, readOnly:false, names:{}, authUser:null };
let AUTH=null, FS=null, unsubs=[];

function initStore(){
  if(!window.firebase || !FIREBASE_CONFIG.apiKey){ showSetup(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth(); FS=firebase.firestore();
  FS.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  AUTH.onAuthStateChanged(u=>{
    unsubs.forEach(f=>f()); unsubs=[];
    S.customers=[]; S.txns=[]; S.trash=[]; S.settings={...DEFAULT_SETTINGS};
    if(!u){ S.authUser=null; S.uid=null; hideLock(); showAuth(); return; }
    S.authUser=u; S.uid=u.uid; S.base=FS.collection('users').doc(u.uid);
    if(lockOn()) showLock(); else hideLock();
    showLoading(); subscribe();
  });
}
function subscribe(){
  const first={c:false,t:false,s:false};
  const ready=()=>{ if(first.c&&first.t&&first.s) boot(); };
  const fail=e=>{ console.warn(e); toast(t('authErr')); };
  unsubs.push(S.base.onSnapshot(snap=>{ S.settings={...DEFAULT_SETTINGS,...(snap.exists?(snap.data().settings||{}):{})}; if(!first.s){first.s=true;ready();} else render(); },fail));
  unsubs.push(S.base.collection('customers').onSnapshot(q=>{ S.customers=q.docs.map(d=>({id:d.id,...d.data()})); if(!first.c){first.c=true;ready();} else render(); },fail));
  unsubs.push(S.base.collection('trash').onSnapshot(q=>{ S.trash=q.docs.map(d=>({id:d.id,...d.data()})); purgeTrash(); renderTrashBadge(); if(sheetOpen&&$('#trashList')) drawTrash(); },()=>{}));
  unsubs.push(S.base.collection('txns').onSnapshot(q=>{ S.txns=q.docs.map(d=>({id:d.id,...d.data()})); if(!first.t){first.t=true;ready();} else render(); },fail));
}

/* ---------- Face ID / fingerprint lock (WebAuthn, per device) ---------- */
const b64u={ enc:buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:s=>{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s); return Uint8Array.from(b,c=>c.charCodeAt(0)); } };
const lockKey=()=>'cbs-lock-'+(S.uid||'');
const lockCred=()=>{ try{ return localStorage.getItem(lockKey()); }catch(e){ return null; } };
const lockOn=()=>!!(S.uid&&lockCred());
let lockSupported=false, locked=false, hiddenAt=0;
(async()=>{ try{ lockSupported=!!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ lockSupported=false; } renderLockRow(); })();
function renderLockRow(){
  const row=$('#lockRow'); if(!row) return; row.hidden=!S.authUser;
  const on=lockOn(); $('#lockToggle').setAttribute('aria-checked',String(on)); $('#lockToggle').disabled=!lockSupported&&!on;
  $('#lockState').textContent = !lockSupported&&!on ? t('lockNA') : on ? t('lockOn') : t('lockOff');
}
async function bioVerify(){
  const id=lockCred(); if(!id) return false;
  const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
    allowCredentials:[{type:'public-key',id:b64u.dec(id),transports:['internal','hybrid']}],userVerification:'required',timeout:60000}});
  return !!a;
}
async function enableLock(){
  const u=S.authUser; if(!u) return;
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Cash Book Smart',id:location.hostname},
      user:{id:new TextEncoder().encode(u.uid).slice(0,64),name:u.email||'Cash Book Smart',displayName:u.email||'Cash Book Smart'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000,attestation:'none'}});
    localStorage.setItem(lockKey(),b64u.enc(cred.rawId)); toast(t('lockEnabled'));
  }catch(e){ if(e&&e.name!=='NotAllowedError') toast(t('lockFail')); }
  renderLockRow();
}
async function disableLock(){
  try{ if(await bioVerify()){ localStorage.removeItem(lockKey()); toast(t('lockDisabled')); } }
  catch(e){ if(e&&e.name!=='NotAllowedError') toast(t('lockFail')); }
  renderLockRow();
}
$('#lockToggle').onclick=()=>{ lockOn()?disableLock():enableLock(); };
function showLock(){
  if(!lockOn()) return; locked=true; if(sheetOpen) closeSheet();
  $('#lock').hidden=false; $('#lockPassBox').hidden=true; $('#lockUsePass').hidden=false; $('#lockHint').textContent=t('lockTap'); $('#lockHint').classList.remove('err');
  setTimeout(()=>{ if(locked) tryUnlock(); },350);
}
function hideLock(){ locked=false; $('#lock').hidden=true; $('#lockPass').value=''; }
let unlocking=false;
async function tryUnlock(){
  if(unlocking) return; unlocking=true;
  try{ if(await bioVerify()) hideLock(); }
  catch(e){ $('#lockHint').textContent=t('lockRetry'); $('#lockHint').classList.add('err'); }
  unlocking=false;
}
$('#lockGo').onclick=tryUnlock;

/* ---------- counters ---------- */
const lastVals={};
function countTo(el,val,f){
  const from=lastVals[el.id]??0; lastVals[el.id]=val;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||from===val){ el.textContent=f(val); return; }
  const t0=performance.now(),dur=900;
  const step=now=>{ const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3); el.textContent=f(from+(val-from)*e); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

const isOpening=x=>x.opening||x.conversion||x.note==='رصيد سابق'||x.note==='Previous balance';
const getRate=()=>+S.settings.rate>0?+S.settings.rate:89500;
const daysUntil=d=>{ if(!d) return 0; const a=new Date(today()+'T12:00:00'), b=new Date(d+'T12:00:00'); return Math.round((b-a)/864e5); };
function dueInfo(c,cur){
  const mine=S.txns.filter(x=>x.customerId===c.id&&curOf(x)===cur).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0));
  let bal=0, pend=[];
  for(const x of mine){ bal+=signed(x); if(bal<=0||near0(bal,cur)) pend=[]; else if(x.type==='deposit'&&x.dueDate) pend.push(x.dueDate); }
  if(!(bal>0)||near0(bal,cur)||!pend.length) return null;
  return pend.sort()[0];
}
const remDays=()=>[15,30,60].includes(+S.settings.reminderDays)?+S.settings.reminderDays:30;
let pendingRem=30;
const daysSince=d=>{ if(!d) return 0; const a=new Date(today()+'T12:00:00'), b=new Date(d+'T12:00:00'); return Math.max(0,Math.round((a-b)/864e5)); };
function lateInfo(c,cur){
  const v=balances(c.id)[cur]; if(!(v>0)||near0(v,cur)) return null;
  const mine=S.txns.filter(x=>x.customerId===c.id&&curOf(x)===cur);
  const pays=mine.filter(x=>x.type==='payment'&&!isOpening(x)).map(x=>x.date||'').sort();
  const deps=mine.filter(x=>x.type==='deposit').map(x=>x.date||'').sort();
  const lastPay=pays.length?pays[pays.length-1]:null;
  const due=dueInfo(c,cur);
  if(due){ const left=daysUntil(due); return {days:Math.max(0,-left),lastPay,late:left<0,due,daysLeft:left}; }
  const ref=lastPay||deps[0]||today();
  const days=daysSince(ref);
  return {days,lastPay,late:days>=remDays(),due:null,daysLeft:null};
}
function reminderText(c,cur){
  const v=balances(c.id)[cur], li=lateInfo(c,cur), co=S.settings.company||'Smart Capital Trade';
  const L=[t('r_hi',{n:c.name}),'',t('r_body',{co}),`*${money(v,cur)}*`,''];
  if(li&&li.due) L.push(t('r_due',{d:fdate(li.due)}));
  L.push(li&&li.lastPay?t('r_last',{d:fdate(li.lastPay)}):t('r_none'));
  L.push('',t('r_end'));
  if(S.settings.phone) L.push(`${t('w_contact')}: ${S.settings.phone}`);
  return L.join('\n');
}
function statusTag(c,st){
  const li=lateInfo(c,VC);
  if(li&&li.late) return `<span class="tag t-late">${t('lateDays',{n:li.days})}</span>`;
  if(li&&li.due&&li.daysLeft<=7) return `<span class="tag t-due">${li.daysLeft===0?t('dueToday'):t('dueIn',{n:li.daysLeft})}</span>`;
  return `<span class="tag t-${st}">${t(st)}</span>`;
}
function custRow(c){
  const v=balances(c.id)[VC],st=st1(v,VC), digits=(c.phone||'').replace(/\D/g,'');
  const quick=digits?`<span class="qbs"><a class="qb" data-quick href="tel:+${digits}" aria-label="${t('call')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a><a class="qb wa" data-quick href="https://wa.me/${digits}" target="_blank" rel="noopener" aria-label="${t('chat')}">${ICON.wa}</a></span>`:'';
  return `<div class="item" role="button" tabindex="0" data-cust="${esc(c.id)}">
    <span class="av" style="background:${avColor(c.id)}">${esc(initials(c.name))}</span>
    <span class="mid"><b>${esc(c.name)}</b><small class="num">${esc(c.phone||t('noPhone'))}</small></span>
    <span class="end"><span class="bl num c-${st}">${money(Math.abs(v),VC)}</span>${statusTag(c,st)}</span></div>`;
}
function txRow(x,showName=true){
  const c=cust(x.customerId),dep=x.type==='deposit',lbl=dep?t('depLabel'):t('payLabel');
  return `<button class="item" data-tx="${esc(x.id)}">
    <span class="txi" style="background:var(--${dep?'owe':'paid'}-bg);color:var(--${dep?'owe':'paid'})">${dep?ICON.up:ICON.down}</span>
    <span class="mid"><b>${showName?esc(c?c.name:t('deletedCust')):lbl}</b><small>${showName?lbl+' · ':''}${fdate(x.date)}${x.note?' · '+esc(x.note):''}</small></span>

}

  const bal=c=>balances(c.id)[VC];

  const ym=today().slice(0,7), month=S.txns.filter(x=>(x.date||'').startsWith(ym)&&curOf(x)===VC);

  const sumOut=month.filter(x=>x.type==='deposit'&&!isOpening(x)).reduce((s,x)=>s+x.amount,0);
  const sumIn=month.filter(x=>x.type==='payment'&&!isOpening(x)).reduce((s,x)=>s+Math.max(0,Math.min(x.amount,balanceBefore(x))),0);
  countTo($('#hTotal'),due,v=>money(v,VC));

  countTo($('#hIn'),sumIn,v=>money(v,VC,true));
  countTo($('#hOut'),sumOut,v=>money(v,VC,true));
  countTo($('#hCount'),S.customers.filter(c=>bal(c)>0 && !near0(bal(c),VC)).length,v=>Math.round(v));
  const top=S.customers.filter(c=>st1(bal(c),VC)==='owe').sort((a,b)=>bal(b)-bal(a)).slice(0,4);
  $('#topDebtors').innerHTML = S.customers.length===0 ? emptyBox(t('emptyFirstT'),t('emptyFirstS'),t('addCust'),'new-customer')
    : top.length ? top.map(custRow).join('') : emptyMsg(t('noDueT'),t('noDueS'));
  const credits=S.customers.filter(c=>st1(bal(c),VC)==='credit').sort((a,b)=>bal(a)-bal(b));
  const crTotal=credits.reduce((s,c)=>s+Math.abs(bal(c)),0);
  $('#crTotal').textContent=money(crTotal,VC);
  $('#crCount').textContent=t('custCount',{n:credits.length});
  $('#creditCard').classList.toggle('zero',!credits.length);
  $('#crSection').hidden=!credits.length;
  $('#creditList').innerHTML=credits.slice(0,4).map(custRow).join('');
  const dues=S.customers.map(c=>({c,li:lateInfo(c,VC)})).filter(x=>x.li&&x.li.due&&!x.li.late&&x.li.daysLeft<=7).sort((a,b)=>a.li.daysLeft-b.li.daysLeft);
  $('#dueSection').hidden=!dues.length; $('#dueList').innerHTML=dues.map(x=>custRow(x.c)).join('');
  const lates=S.customers.map(c=>({c,li:lateInfo(c,VC)})).filter(x=>x.li&&x.li.late);
  $('#lateCard').hidden=!lates.length;
  if(lates.length){ $('#ltTitle').textContent=t('lateTitle',{n:remDays()}); $('#ltTotal').textContent=money(lates.reduce((s,x)=>s+bal(x.c),0),VC); $('#ltCount').textContent=t('custCount',{n:lates.length}); }
  const rec=sortTx(S.txns.filter(x=>curOf(x)===VC)).slice(0,5);
  $('#recentTx').innerHTML = rec.length ? rec.map(x=>txRow(x)).join('') : emptyMsg(t('noTxT'),t('noTxS'));
  const q=($('#cSearch').value||'').trim().toLowerCase();
  let list=S.customers.filter(c=>!q||(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q));
  if(cFilter==='late') list=list.filter(c=>{ const li=lateInfo(c,VC); return li&&li.late; });
  else if(cFilter!=='all') list=list.filter(c=>st1(bal(c),VC)===cFilter);
  list.sort((a,b)=>bal(b)-bal(a)||(a.name||'').localeCompare(b.name||'',LANG));
  $('#custList').innerHTML = S.customers.length===0 ? emptyBox(t('noCustT'),t('noCustS'),t('addCust'),'new-customer')
    : list.length ? list.map(custRow).join('') : emptyMsg(t('noResT'),t('noResS'));
  let tl=sortTx(S.txns.filter(x=>curOf(x)===VC));
  if(tFilter==='deposit'||tFilter==='payment') tl=tl.filter(x=>x.type===tFilter);
  $('#txList').innerHTML = tl.length ? tl.map(x=>txRow(x)).join('') : emptyMsg(t('noTxT'),t('noTxListS'));
  $('#syncNote').textContent = S.mode==='cloud' ? t('syncCloud') : t('syncLocal');
  $$('#curSeg button').forEach(b=>b.classList.toggle('on',b.dataset.c===(S.settings.currency||'USD')));
  if(openCust&&sheetOpen) refreshCustSheet();
}

/* ---------- sheet ---------- */
let sheetOpen=false,openCust=null,lastFocus=null;
function openSheet(title,html){
  openCust=null; repYM=null; lastFocus=document.activeElement;
  $('#shTitle').textContent=title; $('#shBody').innerHTML=html; $('#shBody').scrollTop=0;
  const sc=$('#scrim'); sc.hidden=false; requestAnimationFrame(()=>{ sc.classList.add('show'); $('#sheet').classList.add('show'); });
  sheetOpen=true; if(!matchMedia('(pointer: coarse)').matches) setTimeout(()=>{ const f=$('#shBody [autofocus]'); if(f&&document.activeElement===document.body) f.focus(); },380);
}
function closeSheet(){
  $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); sheetOpen=false; openCust=null;
  setTimeout(()=>{ if(!sheetOpen) $('#scrim').hidden=true; },300);
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
$('#scrim').onclick=closeSheet; $('#shClose').onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheetOpen) closeSheet(); });
function toast(msg){ const el=$('#toast'); $('#toastTxt').textContent=msg; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2400); }

  openSheet(c?t('editCust'):t('newCust'),`
    <div class="field"><label for="fName">${t('name')}</label><input class="inp" id="fName" value="${esc(c?.name||'')}" autofocus></div>

    <div class="field"><label for="fNote">${t('note')}</label><input class="inp" id="fNote" value="${esc(c?.note||'')}" ></div>
    <button class="btn btn-p" id="fSave">${c?t('saveEdit'):t('addCustBtn')}</button>
    ${c?`<div style="height:10px"></div><button class="btn btn-d" id="fDel">${t('delCust')}</button>`:''}`);
  const os=$('#fOpenCur'); if(os) os.querySelectorAll('button').forEach(b=>b.onclick=()=>{ os.dataset.v=b.dataset.v; });
  const od=$('#fOpenDir'); if(od) od.querySelectorAll('button').forEach(b=>b.onclick=()=>{ od.dataset.v=b.dataset.v; });
  $('#fSave').onclick=async()=>{
    const name=$('#fName').value.trim();
    if(!name){ $('#fName').focus(); $('#fName').style.borderColor='var(--owe)'; return; }
    const obj={id:c?.id||uid('c_'),name,cc:$('#fCC').value,phone:fullPhone($('#fPhone').value,dialOf($('#fCC').value)),note:$('#fNote').value.trim(),createdAt:c?.createdAt||Date.now(),createdBy:c?.createdBy||S.uid||null};
    $('#fSave').disabled=true;
    try{
      await put('customers',obj);
      const op=!c&&parseAmt($('#fOpen')?.value);
      if(op&&op>0){ /* opening balance */ const cur=$('#fOpenCur').dataset.v; await put('txns',{id:uid('t_'),customerId:obj.id,type:($('#fOpenDir')?.dataset.v==='payment'?'payment':'deposit'),currency:cur,amount:cur==='LBP'?Math.round(op):Math.round(op*100)/100,note:t('openingNote'),opening:true,date:today(),invoiceNo:nextInvoice(),createdAt:Date.now(),createdBy:S.uid||null}); }
      toast(c?t('saved'):t('added',{n:name}));
      c?openCustomer(obj.id):closeSheet();
    }catch(e){ markWrite(e); $('#fSave').disabled=false; toast(t('saveFail')); }
  };
  if(c) $('#fDel').onclick=async()=>{
    if(!confirm(t('confirmDelCust',{n:c.name}))) return;
    try{ const rel=S.txns.filter(x=>x.customerId===c.id); await toTrash('customer',c,rel); for(const x of rel) await del('txns',x.id); await del('customers',c.id); closeSheet(); toast(t('movedTrash')); }
    catch(e){ markWrite(e); toast(t('saveFail')); }
  };
}

/* ---------- monthly report ---------- */
const ymShift=(ym,n)=>{ let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,'0')}`; };
const ymLabel=(ym,short)=>{ try{ return new Date(ym+'-15T12:00:00').toLocaleDateString(LANG==='ar'?'ar-LB-u-nu-latn':'en-GB',short?{month:'short'}:{month:'long',year:'numeric'}); }catch(e){ return ym; } };
function monthStats(ym,cur){
  const m=S.txns.filter(x=>(x.date||'').startsWith(ym)&&curOf(x)===cur&&!isOpening(x));
  const dep=m.filter(x=>x.type==='deposit').reduce((s,x)=>s+x.amount,0);
  const rin=m.filter(x=>x.type==='payment').reduce((s,x)=>s+Math.max(0,Math.min(x.amount,balanceBefore(x))),0);
  const byCust={}; m.filter(x=>x.type==='deposit').forEach(x=>byCust[x.customerId]=(byCust[x.customerId]||0)+x.amount);
  const top=Object.entries(byCust).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const newC=S.customers.filter(c=>c.createdAt&&new Date(c.createdAt).toISOString().slice(0,7)===ym).length;
  return {dep,rin,net:dep-rin,count:m.length,top,newC};
}
function chartSVG(ym,cur){
  const months=[...Array(6)].map((_,i)=>ymShift(ym,i-5)), data=months.map(k=>monthStats(k,cur));
  const max=Math.max(1,...data.map(d=>Math.max(d.dep,d.rin)));
  const W=600,H=230,B=190,gw=W/6,bw=26;
  const bars=data.map((d,i)=>{ const x=gw*i+gw/2, h1=d.dep/max*150, h2=d.rin/max*150, on=months[i]===ym;
    return `<rect x="${x-bw-3}" y="${B-h1}" width="${bw}" height="${Math.max(h1,2)}" rx="7" fill="var(--owe)" opacity="${on?1:.55}"><animate attributeName="height" from="0" to="${Math.max(h1,2)}" dur=".6s" fill="freeze"/><animate attributeName="y" from="${B}" to="${B-h1}" dur=".6s" fill="freeze"/></rect>
      <rect x="${x+3}" y="${B-h2}" width="${bw}" height="${Math.max(h2,2)}" rx="7" fill="var(--paid)" opacity="${on?1:.55}"><animate attributeName="height" from="0" to="${Math.max(h2,2)}" dur=".6s" fill="freeze"/><animate attributeName="y" from="${B}" to="${B-h2}" dur=".6s" fill="freeze"/></rect>
      <text x="${x}" y="${B+26}" text-anchor="middle" font-size="20" fill="${on?'var(--ink)':'var(--ink-3)'}" font-weight="${on?700:500}">${esc(ymLabel(months[i],true))}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="r-chart" role="img" aria-label="${t('rChart')}"><line x1="0" y1="${B}" x2="${W}" y2="${B}" stroke="var(--line)" stroke-width="2"/>${bars}</svg>
    <div class="r-legend"><span><i style="background:var(--owe)"></i>${t('rDep')}</span><span><i style="background:var(--paid)"></i>${t('rIn')}</span></div>`;
}

const TRASH_DAYS=30;

let xlsxPromise=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxPromise) xlsxPromise=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>res(window.XLSX); s.onerror=()=>{ xlsxPromise=null; rej(new Error('xlsx')); }; document.head.appendChild(s); });
  return xlsxPromise;
}
function buildWorkbook(X){
  const custRows=[...S.customers].sort((a,b)=>(a.name||'').localeCompare(b.name||'',LANG)).map(c=>{ const b=balances(c.id);
    const stx=CURS.map(cu=>{ const s=st1(b[cu],cu); return s==='paid'?'':`${cu}: ${t(s)}`; }).filter(Boolean).join(' / ')||t('paid');
    return {[t('x_name')]:c.name||'',[t('x_phone')]:c.phone||'',[t('x_balUSD')]:Math.round(b.USD*100)/100,[t('x_balLBP')]:Math.round(b.LBP),[t('x_status')]:stx,[t('x_note')]:c.note||''}; });
  const txRows=sortTx(S.txns).reverse().map(x=>({[t('x_inv')]:invLabel(x.invoiceNo),[t('x_date')]:x.date||'',[t('x_cust1')]:(cust(x.customerId)||{}).name||t('deletedCust'),[t('x_type')]:x.type==='deposit'?t('depLabel'):t('payLabel'),[t('x_cur')]:curOf(x),[t('x_amt')]:x.amount,[t('x_desc')]:x.note||''}));
  const wb=X.utils.book_new();
  const s1=X.utils.json_to_sheet(custRows), s2=X.utils.json_to_sheet(txRows);
  s1['!cols']=[{wch:24},{wch:18},{wch:16},{wch:18},{wch:26},{wch:24}]; s2['!cols']=[{wch:12},{wch:12},{wch:24},{wch:16},{wch:8},{wch:14},{wch:30}];
  if(LANG==='ar'){ wb.Workbook={Views:[{RTL:true}]}; }
  X.utils.book_append_sheet(wb,s1,t('x_cust')); X.utils.book_append_sheet(wb,s2,t('x_tx'));
  return wb;
}
async function exportXLSX(){
  const btn=$('#xlsBtn'), sp=btn.querySelector('span');
  if(!window.XLSX){ btn.disabled=true; sp.textContent=t('xlsLoading'); try{ await loadXLSX(); }catch(e){ toast(t('xlsFail')); } btn.disabled=false; sp.textContent=t('xlsBtn'); if(!window.XLSX) return; toast(t('xlsReady')); return; }
  try{
    const X=window.XLSX, out=X.write(buildWorkbook(X),{bookType:'xlsx',type:'array'});
    const name=`CashBook-${today()}.xlsx`, blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ navigator.share({files:[file]}).catch(()=>{}); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  }catch(e){ console.warn(e); toast(t('xlsFail')); }
}

$('#curSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||S.readOnly) return; pendingCur=b.dataset.c; $$('#curSeg button').forEach(x=>x.classList.toggle('on',x===b)); });
$('#saveSettings').onclick=async()=>{
  const b=$('#saveSettings'); b.disabled=true;
  try{ await saveSettingsData({company:$('#sCo').value.trim()||'Smart Capital Trade',phone:$('#sPhone').value.trim(),footer:$('#sFoot').value.trim(),currency:pendingCur,reminderDays:pendingRem,rate:(parseAmt($('#sRate').value)>0?Math.round(parseAmt($('#sRate').value)):getRate())}); toast(t('settingsSaved')); }
  catch(e){ markWrite(e); toast(t('saveFail')); }
  b.disabled=false;
};

let booted=false;
function boot(){
  booted=true; Object.keys(lastVals).forEach(k=>delete lastVals[k]);
  $('#loading').hidden=true; $('#auth').hidden=true; $('#main').hidden=false; $('#nav').hidden=false;
  document.querySelector('header.top').classList.remove('hide-acts');
  VC=(S.settings.currency==='LBP')?'LBP':'USD';
  applyRO(); go('home'); render(); renderMe();
}

/* ---------- constellation background ---------- */
(function(){
  const cv=$('#net'),ctx=cv.getContext('2d'); let W,H,pts=[],dpr=Math.min(2,window.devicePixelRatio||1);
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(70,W*H/16000)); pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*1.4+.4})); }
  function frame(){
    const rgb=getComputedStyle(document.documentElement).getPropertyValue('--net').trim()||'105,150,255';
    ctx.clearRect(0,0,W,H);
    for(const p of pts){ if(!still){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1; } }
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){ const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
      if(d<17000){ ctx.strokeStyle=`rgba(${rgb},${.22*(1-d/17000)})`; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
    for(const p of pts){ ctx.fillStyle=`rgba(${rgb},.75)`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    if(!still) requestAnimationFrame(frame);
  }
  size(); addEventListener('resize',()=>{ size(); if(still) frame(); }); frame();
})();

applyLang(LANG);
initStore();
